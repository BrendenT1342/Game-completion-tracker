<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="shortcut icon" href="Progress badge.png" type="png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Completion Tracker</title>
  </head>
  <body>
    <header>
      <img
        src="Progress badge.png"
        alt="Game progress icon"
        class="header-img"
      />
      <h1>Game Completion Tracker</h1>
      <p>Enter a game name and click "Add" to add it to the list</p>
    </header>
    <div class="container">
      <form id="game-form">
        <input type="text" id="game-name" placeholder="Enter game name" />
      </form>
      <button id="add-button">Add</button>
    </div>

    <h2>Incomplete Games</h2>

    <div id="game-list"></div>

    <h2>Completed Games</h2>

    <div id="completed-list"></div>
    <button id="clear-button">Clear</button>

    <script src="script.js"></script>
  </body>
</html>
